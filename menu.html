  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #faf6ef;
      color: #0b1f3a;
      font-family: 'Poppins', sans-serif;
    }

    /* TOP BAR: BACK TO HOME LEFT, LOGO RIGHT */

    .menu-topbar {
      width: min(1200px, calc(100% - 40px));
      margin: auto;
      padding: 20px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .back-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 10px 17px;
      background: #ffffff;
      color: #0b1f3a;
      border: 1.5px solid #0b1f3a;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      transition: 0.25s;
      flex-shrink: 0;
    }

    .back-home:hover {
      background: #0b1f3a;
      color: #ffffff;
    }

    .logo-link {
      margin-left: auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .top-logo {
      width: 180px;
      height: auto;
      max-height: 90px;
      object-fit: contain;
      display: block;
    }

    /* MENU INTRODUCTION */

    .menu-heading {
      text-align: center;
      padding: 35px 20px 25px;
    }

    .menu-heading .label {
      display: inline-block;
      color: #8b1e1e;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .menu-heading h1 {
      font-family: 'Playfair Display', serif;
      color: #0b1f3a;
      font-size: clamp(2.6rem, 6vw, 4.2rem);
      line-height: 1.1;
      margin: 12px 0 16px;
    }

    .menu-heading p {
      max-width: 680px;
      margin: auto;
      color: #666666;
      font-size: 0.96rem;
      line-height: 1.8;
    }

    /* ORDERS BUTTON */

    .order-link-wrap {
      display: flex;
      justify-content: center;
      margin-top: 22px;
    }

    .orders-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      background: #0b1f3a;
      color: #ffffff;
      border: 1px solid #0b1f3a;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      transition: 0.25s;
    }

    .orders-link:hover {
      background: #d4af37;
      border-color: #d4af37;
      color: #0b1f3a;
    }

    /* CATEGORY BUTTONS */

    #categoryButtons {
      width: min(1100px, calc(100% - 40px));
      margin: 30px auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .category-btn {
      padding: 11px 19px;
      border: 1.5px solid #0b1f3a;
      border-radius: 25px;
      background: #ffffff;
      color: #0b1f3a;
      font: 500 14px 'Poppins', sans-serif;
      cursor: pointer;
      transition: 0.25s;
    }

    .category-btn:hover,
    .category-btn.active {
      background: #d4af37;
      border-color: #d4af37;
      color: #0b1f3a;
    }

    /* MENU ITEMS */

    .menu-content {
      width: min(1200px, calc(100% - 40px));
      margin: auto;
      padding-bottom: 70px;
    }

    .menu-section {
      display: none;
      margin-bottom: 45px;
    }

    .menu-section.active {
      display: block;
    }

    .section-heading {
      text-align: center;
      margin-bottom: 30px;
      border-bottom: 2px solid #d4af37;
    }

    .section-heading h2 {
      font-family: 'Playfair Display', serif;
      color: #0b1f3a;
      font-size: 2rem;
      padding-bottom: 12px;
    }

    .sub-category {
      margin-bottom: 35px;
    }

    .sub-category h3 {
      font-family: 'Playfair Display', serif;
      color: #8b1e1e;
      font-size: 1.35rem;
      border-left: 4px solid #d4af37;
      padding-left: 11px;
      margin-bottom: 18px;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .menu-item {
      background: #ffffff;
      border: 1px solid #e5ddd1;
      border-radius: 8px;
      padding: 17px;
      box-shadow: 0 4px 15px rgba(11, 31, 58, 0.05);
      transition: 0.25s;
    }

    .menu-item:hover {
      transform: translateY(-3px);
      border-color: #d4af37;
      box-shadow: 0 10px 25px rgba(11, 31, 58, 0.1);
    }

    .item-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .item-name {
      flex: 1;
      color: #0b1f3a;
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.5;
      margin: 0;
    }

    .price {
      margin-top: 14px;
      font-size: 1rem;
      font-weight: 600;
      color: #8b1e1e;
    }

    .add-order {
      flex-shrink: 0;
      padding: 7px 10px;
      background: #ffffff;
      color: #0b1f3a;
      border: 1px solid #0b1f3a;
      border-radius: 5px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.68rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.25s;
    }

    .add-order:hover,
    .add-order.added {
      background: #0b1f3a;
      color: #ffffff;
    }

    #emptyMessage {
      text-align: center;
      color: #666666;
      padding: 25px 10px;
    }

    /* FOOTER */

    footer {
      background: #0b1f3a;
      color: #ffffff;
      text-align: center;
      padding: 20px;
      font-size: 13px;
    }

    /* MOBILE RESPONSIVENESS */

    @media (max-width: 850px) {
      .menu-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .top-logo {
        width: 150px;
      }
    }

    @media (max-width: 600px) {
      .menu-topbar {
        width: calc(100% - 28px);
        padding: 15px 0;
        gap: 12px;
      }

      .back-home {
        padding: 9px 11px;
        font-size: 0.76rem;
      }

      .top-logo {
        width: 115px;
        max-height: 70px;
      }

      .menu-heading {
        padding: 30px 15px 20px;
      }

      .menu-heading h1 {
        font-size: 2.5rem;
      }

      #categoryButtons {
        width: calc(100% - 28px);
        gap: 9px;
      }

      .category-btn {
        padding: 9px 13px;
        font-size: 12px;
      }

      .menu-content {
        width: calc(100% - 28px);
      }

      .menu-grid {
        grid-template-columns: 1fr;
      }

      .section-heading h2 {
        font-size: 1.7rem;
      }
    }
  </style>
</head>

    function addToOrders(name, price, button) {
      let orders = [];

      try {
        orders = JSON.parse(localStorage.getItem(ORDERS_KEY) || '[]');

        if (!Array.isArray(orders)) {
          orders = [];
        }
      } catch (error) {
        orders = [];
      }

      const existing = orders.find(order => order.name === name);

      if (existing) {
        existing.quantity = (Number(existing.quantity) || 0) + 1;
      } else {
        orders.push({
          name: name,
          price: Number(price),
          quantity: 1
        });
      }

      localStorage.setItem(ORDERS_KEY, JSON.stringify(orders));

      button.textContent = 'Added ✓';
      button.classList.add('added');

      setTimeout(() => {
        button.textContent = 'Add to Orders';
        button.classList.remove('added');
      }, 1000);
    }

    function showCategory(category) {
      const emptyMessage = document.getElementById('emptyMessage');

      if (emptyMessage) {
        emptyMessage.remove();
      }

      document.querySelectorAll('.category-btn').forEach(button => {
        button.classList.toggle(
          'active',
          button.dataset.category === category
        );
      });

      document.querySelectorAll('.menu-section').forEach(section => {
        section.classList.toggle(
          'active',
          section.dataset.category === category
        );
      });
    }

    menuData.forEach((section, index) => {
      const button = document.createElement('button');

      button.type = 'button';
      button.className = 'category-btn';
      button.textContent = section.category;
      button.dataset.category = section.category;
      button.addEventListener('click', () => showCategory(section.category));

      categoryButtons.appendChild(button);

      const sectionElement = document.createElement('section');

      sectionElement.className = 'menu-section';
      sectionElement.id = 'menu-category-' + index;
      sectionElement.dataset.category = section.category;

      const headingWrap = document.createElement('div');
      headingWrap.className = 'section-heading';

      const heading = document.createElement('h2');
      heading.textContent = section.category;

      headingWrap.appendChild(heading);
      sectionElement.appendChild(headingWrap);

        const sub = document.createElement('div');
        sub.className = 'sub-category';

        const subHeading = document.createElement('h3');
        subHeading.textContent = subcategory.name;
        sub.appendChild(subHeading);

        const grid = document.createElement('div');
        grid.className = 'menu-grid';

        subcategory.items.forEach(item => {
          const card = document.createElement('article');
          card.className = 'menu-item';

          const top = document.createElement('div');
          top.className = 'item-top';

          const itemName = document.createElement('h4');
          itemName.className = 'item-name';
          itemName.textContent = item[0];

          const addButton = document.createElement('button');
          addButton.type = 'button';
          addButton.className = 'add-order';
          addButton.textContent = 'Add to Orders';

          addButton.addEventListener('click', () => {
            addToOrders(item[0], item[1], addButton);
          });

          const price = document.createElement('div');
          price.className = 'price';
          price.textContent = '₹' + item[1];

          top.append(itemName, addButton);
          card.append(top, price);
          grid.appendChild(card);
        });

        sub.appendChild(grid);
        sectionElement.appendChild(sub);
      });

      menuContent.appendChild(sectionElement);
    });
  </script>

</body>
</html>
