    <style>

        /* =====================================================
           PAGE
        ====================================================== */

        .gallery-page {
            min-height: 100vh;
            background: #faf6ef;
            color: #0b1f3a;
        }


        /* =====================================================
           TOP BAR
        ====================================================== */

        .gallery-topbar {
            max-width: 1100px;
            margin: auto;

            padding: 25px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;
        }


        /* =====================================================
           BACK TO HOME
        ====================================================== */

        .back-home {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 9px;

            padding: 10px 17px;

            background: #ffffff;

            color: #0b1f3a;

            border: 1.5px solid #0b1f3a;

            border-radius: 6px;

            text-decoration: none;

            font-size: 0.9rem;

            font-weight: 600;

            cursor: pointer;

            transition:
                background 0.25s ease,
                color 0.25s ease,
                border-color 0.25s ease,
                transform 0.15s ease;
        }

        .back-home i {
            font-size: 0.85rem;
        }

        .back-home:hover {
            background: #0b1f3a;
            color: #ffffff;
            border-color: #0b1f3a;
        }

        .back-home:active {
            background: #0b1f3a;
            color: #ffffff;
            border-color: #0b1f3a;

            transform: scale(0.97);
        }

        .back-home:focus-visible {
            outline: 2px solid #d4af37;
            outline-offset: 3px;
        }


        /* =====================================================
           LOGO
        ====================================================== */

        .top-logo {
            width: 180px;
            height: auto;
            display: block;
        }


        /* =====================================================
           MAIN CONTENT
        ====================================================== */

        .gallery-content {
            width: min(1200px, calc(100% - 40px));

            margin: 0 auto;

            padding: 30px 0 90px;
        }


        /* =====================================================
           PAGE HEADING
        ====================================================== */

        .gallery-heading {
            text-align: center;

            margin-bottom: 45px;
        }

        .gallery-heading .label {
            display: inline-block;

            color: #8b1e1e;

            font-size: 0.75rem;

            font-weight: 600;

            letter-spacing: 3px;

            text-transform: uppercase;
        }

        .gallery-heading h1 {
            font-family: "Playfair Display", serif;

            color: #0b1f3a;

            font-size: clamp(2.6rem, 6vw, 4.3rem);

            line-height: 1.1;

            margin: 12px 0 18px;
        }

        .gallery-heading p {
            max-width: 650px;

            margin: 0 auto;

            color: #666;

            font-size: 0.98rem;

            line-height: 1.8;
        }


        /* =====================================================
           GALLERY GRID
        ====================================================== */

        .dish-gallery {
            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 18px;
        }


        /* =====================================================
           GALLERY ITEM
        ====================================================== */

        .gallery-item {
            position: relative;

            overflow: hidden;

            aspect-ratio: 1 / 1;

            background: #ffffff;

            border-radius: 8px;

            border: 1px solid #e5ddd1;

            cursor: pointer;

            box-shadow:
                0 4px 15px rgba(11, 31, 58, 0.05);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }

        .gallery-item:hover {
            transform: translateY(-5px);

            box-shadow:
                0 12px 30px rgba(11, 31, 58, 0.13);
        }


        /* =====================================================
           IMAGE
        ====================================================== */

        .gallery-item img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            transition:
                transform 0.45s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.06);
        }


        /* =====================================================
           HOVER OVERLAY
        ====================================================== */

        .gallery-overlay {
            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            background: rgba(11, 31, 58, 0.38);

            opacity: 0;

            transition:
                opacity 0.3s ease;
        }

        .gallery-item:hover .gallery-overlay {
            opacity: 1;
        }

        .gallery-overlay i {
            width: 48px;
            height: 48px;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #ffffff;

            color: #0b1f3a;

            border-radius: 50%;

            font-size: 1rem;
        }


        /* =====================================================
           LIGHTBOX
        ====================================================== */

        .lightbox {
            position: fixed;

            inset: 0;

            z-index: 9999;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 30px;

            background: rgba(5, 14, 27, 0.92);
        }

        .lightbox.active {
            display: flex;
        }


        /* =====================================================
           LIGHTBOX IMAGE
        ====================================================== */

        .lightbox-image {
            max-width: min(1100px, 92vw);

            max-height: 85vh;

            width: auto;
            height: auto;

            object-fit: contain;

            border-radius: 6px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.35);
        }


        /* =====================================================
           CLOSE BUTTON
        ====================================================== */

        .lightbox-close {
            position: fixed;

            top: 25px;
            right: 30px;

            width: 45px;
            height: 45px;

            display: flex;

            align-items: center;
            justify-content: center;

            border: 1px solid rgba(255,255,255,0.5);

            border-radius: 50%;

            background: rgba(255,255,255,0.1);

            color: #ffffff;

            font-size: 1.2rem;

            cursor: pointer;

            transition:
                background 0.25s ease,
                transform 0.2s ease;
        }

        .lightbox-close:hover {
            background: #8b1e1e;

            transform: rotate(90deg);
        }


        /* =====================================================
           PREVIOUS / NEXT BUTTONS
        ====================================================== */

        .lightbox-prev,
        .lightbox-next {
            position: fixed;

            top: 50%;

            transform: translateY(-50%);

            width: 48px;
            height: 48px;

            display: flex;

            align-items: center;
            justify-content: center;

            border: 1px solid rgba(255,255,255,0.5);

            border-radius: 50%;

            background: rgba(255,255,255,0.1);

            color: #ffffff;

            cursor: pointer;

            font-size: 1rem;

            transition:
                background 0.25s ease,
                transform 0.2s ease;
        }

        .lightbox-prev {
            left: 25px;
        }

        .lightbox-next {
            right: 25px;
        }

        .lightbox-prev:hover,
        .lightbox-next:hover {
            background: #8b1e1e;
        }


        /* =====================================================
           IMAGE COUNTER
        ====================================================== */

        .lightbox-counter {
            position: fixed;

            bottom: 25px;
            left: 50%;

            transform: translateX(-50%);

            color: #ffffff;

            font-size: 0.85rem;

            letter-spacing: 1px;
        }


        /* =====================================================
           TABLET
        ====================================================== */

        @media (max-width: 1000px) {

            .dish-gallery {
                grid-template-columns: repeat(3, 1fr);
            }

        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media (max-width: 700px) {

            .gallery-topbar {
                padding: 18px;

                gap: 15px;
            }

            .top-logo {
                width: 150px;
            }

            .back-home {
                padding: 9px 13px;

                font-size: 0.8rem;
            }

            .gallery-content {
                width: calc(100% - 32px);

                padding: 25px 0 60px;
            }

            .gallery-heading {
                margin-bottom: 30px;
            }

            .gallery-heading h1 {
                font-size: 2.7rem;
            }

            .gallery-heading p {
                font-size: 0.9rem;
            }

            .dish-gallery {
                grid-template-columns: repeat(2, 1fr);

                gap: 12px;
            }

            .gallery-item {
                border-radius: 6px;
            }

            .gallery-overlay {
                display: none;
            }

            .lightbox {
                padding: 20px;
            }

            .lightbox-image {
                max-width: 95vw;

                max-height: 80vh;
            }

            .lightbox-close {
                top: 15px;
                right: 15px;
            }

            .lightbox-prev {
                left: 12px;
            }

            .lightbox-next {
                right: 12px;
            }

        }


        /* =====================================================
           SMALL MOBILE
        ====================================================== */

        @media (max-width: 420px) {

            .gallery-topbar {
                padding: 15px;

                gap: 10px;
            }

            .top-logo {
                width: 150px;
            }

            .back-home {

                font-size: 0.75rem;

                gap: 6px;

            .gallery-content {
                width: calc(100% - 28px);

            .gallery-heading h1 {

            }

            .gallery-heading .label {
                font-size: 0.68rem;

                letter-spacing: 2px;
            }

            .dish-gallery {
                gap: 10px;
            }

            .lightbox-prev,
            .lightbox-next {
                width: 40px;
                height: 40px;
            }

        /* =====================================================
           VERY SMALL MOBILE
        ====================================================== */

                font-size: 0.7rem;
            }

            .gallery-heading h1 {
                font-size: 2rem;
            }

        /* =====================================================
           REDUCED MOTION
        ====================================================== */

            .gallery-item,
            .gallery-item img,
            .gallery-overlay,
            .lightbox-close {
                transition: none;
            }

        }

                document.getElementById("lightboxPrev");

            const lightboxNext =
                document.getElementById("lightboxNext");

            const lightboxCounter =
                document.getElementById("lightboxCounter");


            let currentIndex = 0;


            /* =================================================
               OPEN LIGHTBOX
            ================================================== */

            function openLightbox(index) {

                currentIndex = index;

                const image =
                    galleryItems[currentIndex].querySelector("img");

                lightboxImage.src = image.src;

                lightboxImage.alt = image.alt;

                lightboxCounter.textContent =
                    `${currentIndex + 1} / ${galleryItems.length}`;

                lightbox.classList.add("active");

                lightbox.setAttribute(
                    "aria-hidden",
                    "false"
                );

                document.body.style.overflow = "hidden";

            }


            /* =================================================
               CLOSE LIGHTBOX
            ================================================== */

            function closeLightbox() {

                lightbox.classList.remove("active");

                lightbox.setAttribute(
                    "aria-hidden",
                    "true"
                );

                document.body.style.overflow = "";

            }


            /* =================================================
               SHOW IMAGE
            ================================================== */

            function showImage(index) {

                if (index < 0) {
                    index = galleryItems.length - 1;
                }

                if (index >= galleryItems.length) {
                    index = 0;
                }

                currentIndex = index;

                const image =
                    galleryItems[currentIndex].querySelector("img");

                lightboxImage.src = image.src;

                lightboxImage.alt = image.alt;

                lightboxCounter.textContent =
                    `${currentIndex + 1} / ${galleryItems.length}`;

            }


            /* =================================================
               GALLERY CLICK
            ================================================== */

            galleryItems.forEach((item, index) => {

                item.addEventListener("click", () => {

                    openLightbox(index);

                });

            });


            /* =================================================
               CLOSE BUTTON
            ================================================== */

            lightboxClose.addEventListener(
                "click",
                closeLightbox
            );


            /* =================================================
               PREVIOUS BUTTON
            ================================================== */

            lightboxPrev.addEventListener(
                "click",
                () => {

                    showImage(currentIndex - 1);

                }
            );


            /* =================================================
               NEXT BUTTON
            ================================================== */

            lightboxNext.addEventListener(
                "click",
                () => {

                    showImage(currentIndex + 1);

                }
            );


            /* =================================================
               CLICK OUTSIDE IMAGE
            ================================================== */

            lightbox.addEventListener(
                "click",
                (event) => {

                    if (event.target === lightbox) {
                        closeLightbox();
                    }

                }
            );


            /* =================================================
               KEYBOARD CONTROLS
            ================================================== */

            document.addEventListener(
                "keydown",
                (event) => {

                    if (
                        !lightbox.classList.contains("active")
                    ) {
                        return;
                    }


                    if (event.key === "Escape") {

                        closeLightbox();

                    }


                    if (event.key === "ArrowLeft") {

                        showImage(currentIndex - 1);

                    }


                    if (event.key === "ArrowRight") {

                        showImage(currentIndex + 1);

                    }

                }
            );

        });

    </script>


</body>

</html>
